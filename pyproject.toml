[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techtember"
version = "0.1.0"
description = "A focused, searchable web corpus for technology-related content."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Techtember" }]
dependencies = [
    "firecrawl-py>=2.0.0,<3.0.0",
]

[project.scripts]
techtember = "techtember.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/techtember"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

